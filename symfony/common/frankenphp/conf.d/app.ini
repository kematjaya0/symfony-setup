; Berlaku untuk dev & prod (base image). validate_timestamps=1 = default
; aman untuk dev (perubahan kode langsung kepakai tanpa restart).
; php.ini TIDAK mendukung sintaks env-var-dengan-default ala shell
; ("${VAR:-default}"), jadi override untuk prod dilakukan lewat file
; .ini terpisah (lihat zzz-opcache-prod.ini) yang cuma di-COPY di stage
; prod dan menimpa nilai ini karena conf.d/*.ini di-load alfabetis.
opcache.enable=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
realpath_cache_size=4096K
realpath_cache_ttl=600
